[package]
name = "viewtally"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A privacy-friendly page-view counter for personal websites, running on Cloudflare Workers and D1"
license = "MIT"
repository = "https://github.com/nylla8444/viewtally-rust"
readme = "README.md"
keywords = ["cloudflare", "workers", "analytics", "counter", "d1"]
categories = ["web-programming", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
worker = { version = "0.8.7", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
