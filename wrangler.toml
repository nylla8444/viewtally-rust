name = "viewtally"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "viewtally"
# Replace with the id that `npx wrangler d1 create viewtally` prints.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Deletes the previous days' salts and visitor hashes, at 00:05 UTC.
[triggers]
crons = ["5 0 * * *"]

# At most 10 hits a minute per visitor IP, per Cloudflare location.
# Optional: the Worker skips the check if this binding is removed.
[[ratelimits]]
name = "HIT_LIMITER"
namespace_id = "1101"
simple = { limit = 10, period = 60 }

[vars]
# Each site id lists the browser origins allowed to count its views.
# One "*" may stand for a subdomain: "https://*.example.com".
SITES = { example = ["https://example.com", "http://localhost:8080"] }
# How long stats responses are cached at the edge and in browsers. "0" turns caching off.
CACHE_SECONDS = "60"

[observability]
enabled = true
